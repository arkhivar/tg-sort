[project]
name = "tg-sort"
version = "0.1.0"
description = "Telegram forum topic sorter: Flask web UI plus a Bot API polling loop that sorts known forum topics."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "bot_handler"]
